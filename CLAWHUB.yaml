# SKILL IDENTITY
skill_id: icalendar-sync
skill_name: iCalendar Sync
display_name: "iCalendar Sync"
version: "2.2.15"
skill_type: runtime
install_type: script

# CRITICAL: This is NOT an instruction-only skill
# This skill includes Python code, install script, and dependencies
runtime_components:
  - Python source code (src/icalendar_sync/)
  - Install script (install.sh)
  - System dependencies (caldav, icalendar, keyring, etc.)

# =============================================================================
# REQUIRED ENVIRONMENT VARIABLES - EXPLICITLY DECLARED
# =============================================================================
# NOTE TO CLAWHUB SCANNER: These credentials are REQUIRED, not optional
# Any registry snapshot showing "required env vars: none" is STALE/CACHED
# =============================================================================

required_environment_variables:
  - name: ICLOUD_USERNAME
    description: "Apple ID email address (e.g., user@icloud.com)"
    type: string
    required: true
    sensitive: false
    example: "user@icloud.com"
    validation: "Must be valid email format"

  - name: ICLOUD_APP_PASSWORD
    description: "App-Specific Password from appleid.apple.com (NOT your main Apple ID password)"
    type: string
    required: true
    sensitive: true
    secret: true
    example: "xxxx-xxxx-xxxx-xxxx"
    validation: "16-character app-specific password format"
    generate_at: "https://appleid.apple.com/account/manage -> Security -> App-Specific Passwords"
    warning: "NEVER use your main Apple ID password - always generate app-specific password"

# Primary credential for security warnings
primary_credential: ICLOUD_APP_PASSWORD

optional_environment_variables:
  - name: DEFAULT_CALENDAR
    description: "Default calendar name if not specified in commands"
    type: string
    default: "Personal"

  - name: LOG_LEVEL
    description: "Logging verbosity level"
    type: string
    default: "INFO"
    allowed_values: ["DEBUG", "INFO", "WARNING", "ERROR"]

# =============================================================================
# AUTHOR & LICENSE
# =============================================================================
author:
  name: "Black_Temple"
  email: "contact@clawhub.ai"
  github: "h8kxrfp68z-lgtm"

license: MIT

repository:
  url: "https://github.com/h8kxrfp68z-lgtm/iCalendar-Sync"
  branch: "main"
  type: "git"

# =============================================================================
# INSTALLATION
# =============================================================================
installation:
  type: script
  install_script: install.sh
  install_command: "bash install.sh"

  installs_to:
    - "~/.openclaw/skills/icalendar-sync/"
    - "~/.local/bin/icalendar-sync"

  requires_system_packages: false
  requires_root: false
  user_level: true

  python_requirements:
    min_version: "3.9"
    packages:
      - "caldav>=1.3.0"
      - "icalendar>=5.0.0"
      - "pyyaml>=6.0"
      - "python-dateutil>=2.8.0"
      - "keyring>=24.0.0"
      - "python-dotenv>=1.0.0"

# =============================================================================
# SECURITY PROFILE
# =============================================================================
security:
  # Credential storage methods (in priority order)
  credential_storage:
    primary:
      method: "OS Keyring"
      implementations:
        - "macOS Keychain"
        - "Windows Credential Manager"
        - "Linux Secret Service (GNOME Keyring / KWallet)"
      encryption: "System-managed, encrypted at rest"
      recommended: true

    fallback_development_only:
      method: "Plaintext file (~/.openclaw/.env)"
      encryption: "NONE - plaintext on disk"
      permissions: "0600 (user read/write only)"
      risk_level: "HIGH"
      warning: "DEVELOPMENT ONLY - NEVER use in production"
      use_when: "OS keyring unavailable (headless servers, minimal containers)"
      mitigation: "Use Docker secrets or external secrets manager instead"

  # Network endpoints
  network_access:
    endpoints:
      - domain: "caldav.icloud.com"
        port: 443
        protocol: "HTTPS"
        purpose: "Apple CalDAV API endpoint"
        ssl_verification: enforced

      - domain: "p*-caldav.icloud.com"
        port: 443
        protocol: "HTTPS"
        purpose: "Apple CalDAV CDN (region-specific)"
        ssl_verification: enforced
        note: "* is region code (e.g., p01, p02, etc.)"

    no_telemetry: true
    no_analytics: true
    no_third_party: true

  # Input validation & rate limiting
  input_validation: true
  output_sanitization: true
  rate_limiting:
    enabled: true
    max_requests: 10
    time_window_seconds: 60

  # Sensitive data handling
  sensitive_data_filtering: true
  logs_sanitized: true
  no_credential_logging: true

# =============================================================================
# SECURITY WARNINGS & CONCERNS
# =============================================================================
security_warnings:
  critical:
    - "ALWAYS use App-Specific Password from appleid.apple.com, NEVER your main Apple ID password"
    - "ALWAYS use OS keyring for credential storage in production environments"
    - "NEVER commit ~/.openclaw/.env to version control"

  high:
    - "Headless mode (--password CLI flag) stores password in process memory and shell history"
    - "On multi-user systems, avoid --password flag; use keyring or secrets manager"
    - "In CI/CD pipelines, use platform secrets (GitHub Secrets, GitLab CI Variables, etc.)"
    - "In Docker, use Docker secrets or external vault, NOT environment variables"

  medium:
    - "Install script writes to user home directory (~/.openclaw, ~/.local/bin)"
    - "Plaintext .env fallback available if keyring unavailable (chmod 0600 enforced)"
    - "For production headless environments, prefer external secrets manager"

# Risk mitigation guidance
security_best_practices:
  - "Generate app-specific password at: https://appleid.apple.com/account/manage"
  - "Run 'icalendar-sync setup' interactively to store credentials in keyring"
  - "Never use --password flag in production or on shared systems"
  - "Delete ~/.openclaw/.env if it exists and use keyring instead"
  - "For Docker: mount external secrets volume or use orchestrator secrets"
  - "For CI/CD: use platform secret stores, inject at runtime"
  - "Regularly rotate app-specific passwords"

# =============================================================================
# CAPABILITIES & PURPOSE
# =============================================================================
description: |
  Professional iCloud Calendar integration for OpenClaw agents via CalDAV protocol.
  Provides bidirectional synchronization with iCloud calendars.
  Supports event creation, retrieval, updates, deletion, recurring events, and
  multi-language calendar names (Cyrillic, Chinese, Arabic, etc.).

purpose: "iCloud CalDAV calendar synchronization for OpenClaw AI agents"

capabilities:
  core:
    - "List accessible iCloud calendars"
    - "Retrieve calendar events with date range filtering"
    - "Create new calendar events with alarms and descriptions"
    - "Delete calendar events by UID"
    - "Update existing events"

  features:
    - "Recurring events (RRULE: DAILY, WEEKLY, MONTHLY, YEARLY)"
    - "Event alarms and reminders"
    - "All-day events support"
    - "Multi-language calendar names (20+ languages including Cyrillic)"
    - "Timezone-aware datetime handling"
    - "Event attendees and organizers"

commands:
  - name: setup
    description: "Interactive credential setup with keyring storage"
    usage: "icalendar-sync setup"
    permissions: [admin]
    stores_credentials: true

  - name: list
    description: "List all accessible iCloud calendars"
    usage: "icalendar-sync list"
    permissions: [read]

  - name: get
    description: "Retrieve events from specified calendar"
    usage: "icalendar-sync get --calendar NAME [--days N]"
    permissions: [read]

  - name: create
    description: "Create new calendar event"
    usage: "icalendar-sync create --calendar NAME --json DATA"
    permissions: [create]

  - name: delete
    description: "Delete calendar event by UID"
    usage: "icalendar-sync delete --calendar NAME --uid UID"
    permissions: [delete]

# =============================================================================
# PLATFORM SUPPORT
# =============================================================================
platforms:
  - name: "Linux"
    tested: true
    keyring_backend: "Secret Service (GNOME Keyring / KWallet)"

  - name: "macOS"
    tested: true
    keyring_backend: "Keychain"

  - name: "Windows"
    tested: true
    keyring_backend: "Credential Manager"

python_versions:
  - "3.9"
  - "3.10"
  - "3.11"
  - "3.12"

