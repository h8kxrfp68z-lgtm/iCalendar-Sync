name: icalendar-sync
display_name: "iCalendar Sync"
version: 2.1.1
description: >
  Professional iCloud Calendar integration for OpenClaw.
  Features enterprise-grade security, Zero Trust access control,
  and multi-agent isolation.

author: Black_Temple
license: MIT
repository: https://github.com/h8kxrfp68z-lgtm/OpenClaw
homepage: https://clawhub.ai/skills/icalendar-sync

category: productivity
tags:
  - calendar
  - icloud
  - apple
  - sync
  - productivity
  - security
  - multi-agent

runtime:
  type: python
  version: ">=3.9"

dependencies:
  python:
    - caldav>=1.3.0
    - icalendar>=5.0.0
    - pyyaml>=6.0
    - python-dateutil>=2.8.0

environment:
  - name: ICLOUD_USERNAME
    description: "Apple ID email address (e.g., name@icloud.com)"
    required: true
    placeholder: "user@icloud.com"
  
  - name: ICLOUD_APP_PASSWORD
    description: "App-Specific Password from appleid.apple.com"
    required: true
    secure: true
    placeholder: "xxxx-xxxx-xxxx-xxxx"
  
  - name: DEFAULT_CALENDAR
    description: "Default calendar name if not specified"
    required: false
    default: "Personal"
  
  - name: LOG_LEVEL
    description: "Logging level (DEBUG, INFO, WARNING, ERROR)"
    required: false
    default: "INFO"

capabilities:
  agent_aware: true
  supports_isolation: true
  security_model: "zero-trust"
  acl_version: "2.0"

commands:
  - name: create_event
    description: Create a new calendar event with conflict detection
    schema:
      type: object
      required: [summary, start, end]
      properties:
        summary:
          type: string
          description: "Event title"
        start:
          type: string
          description: "ISO 8601 datetime (e.g., 2026-02-10T14:00:00+03:00)"
        end:
          type: string
          description: "ISO 8601 datetime (e.g., 2026-02-10T15:00:00+03:00)"
        description:
          type: string
          description: "Event details (optional)"
        location:
          type: string
          description: "Event location (optional)"
        attendees:
          type: array
          items:
            type: string
          description: "List of attendee emails (optional)"
        alarms:
          type: array
          items:
            type: object
            properties:
              minutes:
                type: integer
                description: "Minutes before event to trigger alarm"
              description:
                type: string
                description: "Alarm description"
          description: "List of alarms (optional)"
        rrule:
          type: object
          properties:
            freq:
              type: string
              enum: [DAILY, WEEKLY, MONTHLY, YEARLY]
              description: "Recurrence frequency"
            interval:
              type: integer
              description: "Interval between occurrences"
            count:
              type: integer
              description: "Number of occurrences"
            until:
              type: string
              description: "End date for recurrence (ISO 8601)"
            byday:
              type: array
              items:
                type: string
              description: "Days of week (e.g., MO, TU, WE)"
          description: "Recurrence rule (optional)"
        check_conflicts:
          type: boolean
          default: true
          description: "Check for conflicting events"
    usage: "create_event <calendar> <json_data>"
    permissions: [create]
  
  - name: get_events
    description: Sync and retrieve calendar events
    schema:
      type: object
      required: [calendar]
      properties:
        calendar:
          type: string
          description: "Calendar name"
        days_ahead:
          type: integer
          default: 7
          description: "Number of days to look ahead"
    usage: "get_events <calendar> [--days-ahead 7]"
    permissions: [read]
  
  - name: delete_event
    description: Remove event from calendar
    schema:
      type: object
      required: [calendar, uid]
      properties:
        calendar:
          type: string
          description: "Calendar name"
        uid:
          type: string
          description: "Event UID"
    usage: "delete_event <calendar> <uid>"
    permissions: [delete]
  
  - name: list_calendars
    description: List accessible iCloud calendars
    schema:
      type: object
      properties: {}
    usage: "list_calendars"
    permissions: [read]
  
  - name: setup
    description: Configure iCloud credentials interactively
    schema:
      type: object
      properties: {}
    usage: "setup"
    permissions: [admin]
